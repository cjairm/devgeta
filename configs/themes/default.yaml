# [devgeta]
#
# The `default` theme: today's colors, recorded verbatim so wiring
# `current_theme` through is a visually null change. See
# docs/decisions/ADR-0043-a-theme-is-a-palette-file-not-a-branch-in-every-template.md
# for the role names, the two-group split, and why `terminal:` exists.
#
# `colors:` is classic Gruvbox (tmux, Neovim, OpenCode, Claude, i3).
# `terminal:` is Gruvbox Material (Alacritty, Ghostty).

neovim_module: gruvbox

# Ships alongside this file under configs/themes/wallpapers/ and is resolved
# relative to the extracted configs tree, so it is present on every machine
# devgeta installs on. `dg theme set-wallpaper` overrides it per machine.
wallpaper: wallpapers/default.jpg

colors:
