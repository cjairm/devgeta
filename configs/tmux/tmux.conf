unbind r
bind r source-file ~/.tmux.conf

unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

set -ga terminal-overrides ",xterm-256color*:Tc"
set -g default-terminal "tmux-256color"
set -s escape-time 0

# Spawn panes/windows as non-login shells. tmux defaults to login shells,
# which re-run the profile chain (/etc/zprofile, ~/.zprofile) on every new
# pane even though ~/.zshrc already provides the full environment — measured
# ~0.85s of duplicated init per pane. Non-login shells still run ~/.zshrc,
# so behavior is identical, just faster.
#
# CONSTRAINT: this value must stay a single simple command — no `;`, `&&`,
# or multiple statements. tmux-resurrect restores panes with
# `cat <saved-contents>; exec <default-command>`, so a compound value gets
# truncated at the first separator and the pane execs the wrong word and
# dies at birth (restored sessions collapse and the whole server exits).
# PATH repair for servers born from the bare launchd GUI environment lives
# in alacritty/starter.sh, at server birth, where it also fixes plugin
# scripts (e.g. continuum autosave) that run with the server's environment.
# Complementing that, per-shell PATH self-repair lives in configs/zsh/zshenv.zsh
# (wired into ~/.zshenv by `dg configure`), so a pane still repairs itself even
# when a new tmux session inherits a broken PATH from its invoking client.
set -g default-command '${SHELL:-/bin/zsh}'

# set the first window to 1 instead. To stay consistent, let’s do the same with the panes
set -g base-index 1
set-window-option -g pane-base-index 1

# Being able to have thousands of lines of output history
set -g history-limit 100000

set -g mouse on

# When the attached session is destroyed (e.g. its last window was a worktree
# or the workspace dashboard and got closed), jump to another session instead
# of detaching — detaching kills the client and closes the terminal window
# with it.
set -g detach-on-destroy off

# Forward focus events to programs inside panes. Neovim needs these
# (FocusGained/FocusLost) so it can dim itself when its pane goes inactive —
# the tmux-level fg dimming below only affects default-colored text, which
# Neovim's colorscheme overrides.
set -g focus-events on

# v and h are not bound by default, but we never know in the next versions...
unbind v
unbind -

unbind % # Split vertically
unbind '"' # Split horizontally

bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# To navigate from pane to pane, you can use prefix key -> ARROW KEY by default, too
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Opening tmux Windows
unbind n  #DEFAULT KEY: Move to next window
unbind w  #DEFAULT KEY: change current window interactively

bind n command-prompt "rename-window '%%'"
bind w new-window -c "#{pane_current_path}"

# Use lead+h to go to the next window, and lead+l to go to the previous one, without using the prefix key
bind h previous-window
bind l next-window

# copy mode gives us the possibility to navigate in the termina, using Emacs or Vi key bindings.
set-window-option -g mode-keys vi

# Unsurprisingly, you can use copy mode to copy some content. But if you tried to copy terminal 
# outputs already from tmux with your mouse, you might be confused: it doesn’t really work.
#
# Indeed, tmux by default doesn’t copy anything in your system clipboard, but in one of its
# paste buffer. But, for convenience, I prefer using the system clipboard each time I copy
# something from the terminal. Let’s configure that now:
unbind -T copy-mode-vi Space; #Default for begin-selection
unbind -T copy-mode-vi Enter; #Default for copy-selection

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel --clipboard"

# Integrate Your tmux With Vim
set -g -a terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

#### COLOUR (Gruvbox dark)

# default statusbar colors
set-option -g status-style fg=#fabd2f,bg=#282828 # bright_yellow on dark0_hard

# default window title colors
set-window-option -g window-status-style fg=#83a598,bg=default # bright_blue on default

# active window title colors
set-window-option -g window-status-current-style fg=#fe8019,bg=default # bright_orange on default

# pane border
set-option -g pane-border-style fg=#3c3836 # dark1
set-option -g pane-active-border-style fg=#b8bb26 # bright_green

# Make the active pane obvious without painting a solid background (which would
# punch through Alacritty's transparency/blur). Dim inactive panes' default
# foreground, keep the active pane at full brightness, and emphasize the active
# border with a heavier line plus arrows pointing at it.
set-window-option -g window-style fg=#928374          # inactive panes: muted gray
set-window-option -g window-active-style fg=#ebdbb2   # active pane: bright fg
set-window-option -g pane-border-lines heavy          # heavy line on the active border
set-window-option -g pane-border-indicators arrows    # arrows point at the active pane

# message text
set-option -g message-style fg=#fe8019,bg=#282828 # bright_orange on dark0_hard

# pane number display
set-option -g display-panes-active-colour "#fe8019" # bright_orange
set-option -g display-panes-colour "#83a598" # bright_blue

# clock
set-window-option -g clock-mode-colour "#b8bb26" # bright_green

# bell
set-window-option -g window-status-bell-style fg=#282828,bg=#fb4934 # dark0_hard on bright_red

# To have the ability to use Tab for autocomplete
unbind -n Tab

# devgeta workspace dashboard
# Bare ctrl+t opens the unified workspace dashboard (worktrees + standalone
# sessions) fullscreen in a dedicated window.
# Uses full binary path to avoid needing interactive shell (faster startup)
# The window closes automatically when you quit the dashboard (q)
unbind C-t
bind -n C-t new-window -n "[workspace]" "~/.local/bin/devgeta ws"

#### PLUGINS (TPM)

# Persist tmux state across reboots: resurrect saves/restores sessions,
# windows, panes, layouts and working dirs; continuum autosaves every 15 min
# and restores everything when the tmux server starts.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore automatically on server start (no manual keypress after reboot)
set -g @continuum-restore 'on'
# Save visible pane text so restored panes don't come back empty
set -g @resurrect-capture-pane-contents 'on'
# Restore Neovim via its session file. Needs vim-obsession in the nvim
# config, and `:Obsession` run once per project to start tracking.
set -g @resurrect-strategy-nvim 'session'
# Relaunch AI coders in restored panes, resuming their most recent
# conversation. `--continue` is per-directory for claude (and resurrect
# restores each pane's working dir first), so worktree panes resume their
# own session. Panes with no prior conversation just print an error and
# drop to the shell.
set -g @resurrect-processes '"claude->claude --continue" "opencode->opencode --continue"'

# Bootstrap: clone TPM and install plugins on first launch (idempotent)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM — must stay the last line of this file
run '~/.tmux/plugins/tpm/tpm'
