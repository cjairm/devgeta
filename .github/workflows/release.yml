name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Needed by actions/attest-build-provenance: id-token to mint the Sigstore
  # OIDC identity, attestations to publish the provenance statement to this
  # repo's attestation store.
  id-token: write
  attestations: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history + tag objects: the release body below is read from the
          # annotated tag's own message, and a shallow checkout fetches the tag
          # ref without the annotation object that carries it.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # The release notes ARE the annotated tag's message. CLAUDE.md §9 already
      # requires every release to be tagged through
      # `devgeta task release <version> --message-file <file>`, which refuses an
      # empty message — so that text is written, reviewed, and guaranteed to
      # exist. Without this step it was then discarded: generate_release_notes
      # builds its bullet list from merged pull requests, and this repo tags
      # straight from main, so every release page showed nothing but a compare
      # link while the real summary sat unread in the tag.
      - name: Read release notes from the annotated tag
        id: tag_notes
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          # actions/checkout fetches every tag correctly and then OVERWRITES this
          # one, re-fetching the raw commit SHA into refs/tags/<version>:
          #   git fetch --no-tags origin +<sha>:refs/tags/<version>
          #   t [tag update]  <sha> -> <version>
          # That leaves a LIGHTWEIGHT tag, whose %(contents) is the commit's
          # message rather than the annotation `devgeta task release` wrote — so
          # the page silently published the last commit message instead of the
          # release notes. Re-fetch the real tag object before reading it.
          git fetch --force origin "refs/tags/${VERSION}:refs/tags/${VERSION}"

          # Then fail loudly. Reading a lightweight tag does not error, it just
          # returns the wrong text, which is how this went unnoticed across
          # three releases: the body looked plausible because a squashed release
          # commit happens to carry the same message.
          OBJTYPE="$(git cat-file -t "refs/tags/${VERSION}")"
          if [ "$OBJTYPE" != "tag" ]; then
            echo "::error::refs/tags/${VERSION} is a ${OBJTYPE}, not an annotated tag; refusing to publish a release body read from it." >&2
            exit 1
          fi

          # %(contents) is the annotation's subject + body, without any
          # signature block.
          NOTES="$(git tag -l --format='%(contents)' "$VERSION" \
            | sed '/^Co-Authored-By:/d' \
            | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')"
          # Heredoc delimiter, so a multi-line body survives into the output.
          {
            echo 'NOTES<<DEVGETA_RELEASE_NOTES_EOF'
            echo "$NOTES"
            echo 'DEVGETA_RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          COMMIT: ${{ github.sha }}
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SHORT_COMMIT=$(echo "$COMMIT" | cut -c1-7)
          LDFLAGS="-s -w \
            -X 'github.com/cjairm/devgeta/pkg/buildinfo.Version=${VERSION}' \
            -X 'github.com/cjairm/devgeta/pkg/buildinfo.Commit=${SHORT_COMMIT}' \
            -X 'github.com/cjairm/devgeta/pkg/buildinfo.BuildDate=${BUILD_DATE}'"

          GOOS=darwin  GOARCH=amd64 go build -o devgeta-darwin-amd64  -ldflags="$LDFLAGS" .
          GOOS=darwin  GOARCH=arm64 go build -o devgeta-darwin-arm64  -ldflags="$LDFLAGS" .
          GOOS=linux   GOARCH=amd64 go build -o devgeta-linux-amd64   -ldflags="$LDFLAGS" .
          GOOS=linux   GOARCH=arm64 go build -o devgeta-linux-arm64   -ldflags="$LDFLAGS" .

          chmod +x devgeta-*

      # The integrity floor for install.sh's follow-up verification (see
      # ADR-0031): a SHA-256 digest of each binary, published as its own
      # release asset so it can be checked with bash+curl alone before any
      # of the four binaries are executed.
      - name: Generate checksums
        run: sha256sum devgeta-* > checksums.txt

      # Binds each binary's digest to this workflow run and records it in
      # Sigstore's public transparency log — a trust root outside the
      # release assets themselves, so it isn't defeated by whatever also
      # let an attacker rewrite a binary and checksums.txt together. Attests
      # the files on disk; it doesn't need the release to exist yet.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            devgeta-darwin-amd64
            devgeta-darwin-arm64
            devgeta-linux-amd64
            devgeta-linux-arm64

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
        with:
          files: |
            devgeta-darwin-amd64
            devgeta-darwin-arm64
            devgeta-linux-amd64
            devgeta-linux-arm64
            checksums.txt
          # body is PREPENDED to the auto-generated notes, so the release page
          # leads with the tag's own summary and still ends with GitHub's
          # "Full Changelog" compare link.
          body: ${{ steps.tag_notes.outputs.NOTES }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
